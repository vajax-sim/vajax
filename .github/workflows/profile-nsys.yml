name: nsys GPU Profiling

on:
  workflow_dispatch:
    inputs:
      circuit:
        description: 'Circuit to profile'
        type: choice
        options:
          - rc
          - graetz
          - mul
          - ring
          - c6288
          - tb_dp
        default: ring
      timesteps:
        description: 'Number of timesteps'
        default: '50'
      sparse:
        description: 'Use sparse solver (for large circuits)'
        type: boolean
        default: false
      fori_loop:
        description: 'Use fori_loop NR solver (fixed iterations, GPU-fusible)'
        type: boolean
        default: false
      fixed_step:
        description: 'Use fixed-step transient (no adaptive dt, full GPU fusion)'
        type: boolean
        default: false

# Only one profiling job at a time on the GPU runner
concurrency:
  group: nsys-profile
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: "sccache"

jobs:
  nsys-profile:
    runs-on: nvidia-runner-1
    timeout-minutes: 60

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: CUDA environment diagnostics
        run: |
          echo "=== GPU Info ==="
          nvidia-smi || echo "nvidia-smi not available"
          echo ""
          echo "=== CUDA Version ==="
          nvcc --version 2>/dev/null || echo "nvcc not in PATH"
          echo ""
          echo "=== nsys Version ==="
          nsys --version 2>/dev/null || echo "nsys not in PATH"

      - name: Install LLVM 18
        run: |
          if ! llvm-config-18 --version 2>/dev/null; then
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
            sudo chmod a+r /etc/apt/trusted.gpg.d/apt.llvm.org.asc
            wget -q https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 18
            rm llvm.sh
          fi
          echo "LLVM_SYS_181_PREFIX=/usr/lib/llvm-18" >> $GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        with:
          disable_annotations: true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: openvaf_jax/openvaf_py

      - name: Install CUDA toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y cuda-nvcc-12-8 cuda-cudart-dev-12-8
          echo "/usr/local/cuda-12.6/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt-get install -y libsuitesparse-dev swig cmake pkg-config

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Build openvaf-py
        working-directory: openvaf_jax/openvaf_py
        run: |
          uv sync
          uv run maturin develop --release

      - name: Install vajax with CUDA dependencies
        run: uv sync --extra cuda12

      - name: Restore JAX compilation cache
        uses: actions/cache@v4
        with:
          path: /tmp/jax-cache
          key: jax-cache-${{ inputs.circuit }}-${{ inputs.sparse }}-${{ hashFiles('vajax/**/*.py') }}
          restore-keys: |
            jax-cache-${{ inputs.circuit }}-${{ inputs.sparse }}-
            jax-cache-${{ inputs.circuit }}-

      - name: Run nsys profiling
        env:
          JAX_PLATFORMS: cuda,cpu
          XLA_FLAGS: "--xla_gpu_autotune_level=0 --xla_dump_to=/tmp/hlo_dump --xla_dump_hlo_as_text=true"
          JAX_COMPILATION_CACHE_DIR: /tmp/jax-cache
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_PYTHON_CLIENT_ALLOCATOR: platform
          TF_CPP_MIN_LOG_LEVEL: "2"
          # Disable in-loop progress reporting. The default progress_interval=100
          # wraps a jax.debug.callback in a lax.cond inside the compiled while
          # body, which forces XLA-GPU into host-ordered execution and adds
          # ~1.3 s/step of serialization overhead. This env var causes
          # progress_interval to default to 0, which skips the cond entirely.
          VAJAX_NO_PROGRESS: "1"
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.sparse }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --sparse"
          fi
          if [ "${{ inputs.fori_loop }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --fori-loop"
          fi
          if [ "${{ inputs.fixed_step }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --fixed-step"
          fi

          TIMESTAMP=$(date +%s)
          PROFILE_NAME="nsys-${{ inputs.circuit }}-${TIMESTAMP}"

          echo "=== Starting nsys GPU Profiling ==="
          echo "Circuit: ${{ inputs.circuit }}"
          echo "Timesteps: ${{ inputs.timesteps }}"
          echo "Sparse: ${{ inputs.sparse }}"
          echo "fori_loop: ${{ inputs.fori_loop }}"
          echo "fixed_step: ${{ inputs.fixed_step }}"
          echo "Commit: ${{ github.sha }}"

          nsys profile \
            --trace=cuda,nvtx,osrt \
            --osrt-threshold=0 \
            --output "/tmp/${PROFILE_NAME}" \
            uv run python scripts/nsys_profile_target.py \
              ${{ inputs.circuit }} ${{ inputs.timesteps }} ${EXTRA_FLAGS}

          echo "profile_name=${PROFILE_NAME}" >> "$GITHUB_ENV"

      - name: Analyze HLO for host-forcing ops
        if: always()
        run: |
          HLO_DIR="/tmp/hlo_dump"
          if [ ! -d "$HLO_DIR" ]; then
            echo "No HLO dump found at $HLO_DIR"
            exit 0
          fi

          echo "=== HLO dump subdirectories (top 20 by size) ==="
          du -sh "$HLO_DIR"/jit_* 2>/dev/null | sort -rh | head -20

          # XLA dumps each JIT module into its own subdirectory.
          # Find the largest after_optimizations.txt — that's the main transient module.
          OPTIMIZED=$(find "$HLO_DIR" -name "*.after_optimizations.txt" -exec wc -c {} + 2>/dev/null \
            | grep -v ' total$' | sort -rn | head -1 | awk '{print $2}')
          if [ -z "$OPTIMIZED" ]; then
            # Fallback: largest .txt anywhere in dump
            OPTIMIZED=$(find "$HLO_DIR" -name "*.txt" -exec wc -c {} + 2>/dev/null \
              | grep -v ' total$' | sort -rn | head -1 | awk '{print $2}')
          fi

          if [ -z "$OPTIMIZED" ]; then
            echo "No HLO text files found"
            exit 0
          fi

          echo "=== Analyzing: $OPTIMIZED ==="
          echo "File size: $(wc -c < "$OPTIMIZED") bytes"

          # Also list all modules with while loops
          echo ""
          echo "=== All HLO modules containing 'while' ==="
          find "$HLO_DIR" -name "*.after_optimizations.txt" -exec grep -l 'while' {} + 2>/dev/null | head -10 || echo "(none)"

          # Count host-forcing ops in while body
          echo ""
          echo "=== Host-forcing ops in HLO ==="
          echo "custom-call count: $(grep -c 'custom-call' "$OPTIMIZED" || echo 0)"
          echo "send/recv count: $(grep -c -E '\b(send|recv)\b' "$OPTIMIZED" || echo 0)"
          echo "infeed/outfeed count: $(grep -c -E '\b(infeed|outfeed)\b' "$OPTIMIZED" || echo 0)"
          echo "all-reduce count: $(grep -c 'all-reduce' "$OPTIMIZED" || echo 0)"

          # Extract while loop bodies and find host ops within them
          echo ""
          echo "=== custom-call targets (host callbacks) ==="
          grep 'custom-call' "$OPTIMIZED" | sed 's/.*custom_call_target="\([^"]*\)".*/\1/' | sort | uniq -c | sort -rn | head -20

          # Look for host callback patterns
          echo ""
          echo "=== Host callback / debug patterns ==="
          grep -n -E '(host_callback|debug_callback|xla_python_cpu_callback|xla_python_gpu_callback|callback)' "$OPTIMIZED" | head -20 || echo "(none found)"

          # Find while loop structure
          echo ""
          echo "=== While loop structure ==="
          grep -n 'while' "$OPTIMIZED" | head -10 || echo "(no while loops found)"

          # Save full analysis for artifact
          {
            echo "HLO file: $(basename "$OPTIMIZED")"
            echo "---"
            grep -n 'custom-call' "$OPTIMIZED" | head -50
          } > /tmp/hlo_analysis.txt

      - name: Generate summary
        if: always()
        run: |
          {
            echo "## nsys GPU Profiling Results"
            echo ""
            echo "**Circuit:** ${{ inputs.circuit }}"
            echo "**Timesteps:** ${{ inputs.timesteps }}"
            echo "**Sparse:** ${{ inputs.sparse }}"
            echo "**fori_loop NR:** ${{ inputs.fori_loop }}"
            echo "**fixed_step:** ${{ inputs.fixed_step }}"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          REPORT="/tmp/${profile_name}.nsys-rep"
          if [ ! -f "$REPORT" ]; then
            echo "_No nsys report found_" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Run each report; errors (e.g. missing traces) don't fail the step.
          # Capture output once, then tee to both the step summary and stdout
          # so the log is greppable from `gh run view --log`.
          run_report() {
            local title="$1"
            local name="$2"
            local lines="${3:-25}"
            local output
            output=$(nsys stats "$REPORT" --report "$name" 2>&1 | head -"$lines" || true)
            {
              echo "### ${title}"
              echo ""
              echo '```'
              echo "$output"
              echo '```'
              echo ""
            } | tee -a "$GITHUB_STEP_SUMMARY"
          }

          run_report "GPU Kernel Summary"           cuda_gpu_kern_sum 40
          run_report "CUDA API Summary (launch/sync overhead)" cuda_api_sum 30
          run_report "OS Runtime Summary"           osrt_sum 30
          run_report "GPU Memory Ops"               cuda_gpu_mem_time_sum 20
          run_report "NVTX / XLA Op Summary"        nvtx_sum 40

          # Pthread breakdown from osrt trace — helps attribute the 500ms
          # pthread_cond_timedwait pattern to a specific XLA/PjRt thread.
          {
            echo "### Pthread Calls (from OS Runtime trace)"
            echo ""
            echo '```'
            nsys stats "$REPORT" --report osrt_sum \
              --format csv 2>/dev/null \
              | grep -i "pthread" | head -20 || echo "(no pthread data in osrt trace)"
            echo '```'
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # HLO host-callback analysis
          if [ -f /tmp/hlo_analysis.txt ]; then
            {
              echo "### HLO Host-Forcing Ops"
              echo ""
              echo '```'
              cat /tmp/hlo_analysis.txt
              echo '```'
              echo ""
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload nsys report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsys-profile-${{ inputs.circuit }}-${{ github.sha }}
          path: /tmp/nsys-*.nsys-rep
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload HLO dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hlo-dump-${{ inputs.circuit }}-${{ github.sha }}
          path: |
            /tmp/hlo_dump/*.txt
            /tmp/hlo_analysis.txt
          if-no-files-found: ignore
          retention-days: 7
